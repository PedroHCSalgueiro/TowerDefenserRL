name: CI

# Lint, testes e build a cada push na `main` e nos branches de trabalho, sem
# publicar (quem publica é o deploy.yml, a partir do branch `playtest`).
on:
  push:
    branches-ignore: [playtest]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
